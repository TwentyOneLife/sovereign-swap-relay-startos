name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by commit; Dependabot keeps the pins fresh (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Repo hygiene
        run: |
          set -e
          test -f README.md
          test -f LICENSE
          test -f PLAN.md
          test -f Dockerfile
          test -f startos/manifest/index.ts
          echo "hygiene OK"
      - name: Install
        run: npm ci
      - name: Formatting
        run: npx prettier --check startos
      - name: Types
        run: npx tsc --noEmit
      - name: Workflows parse
        run: |
          node -e '
            const YAML = require("yaml"), fs = require("fs");
            for (const f of [
              ".github/workflows/ci.yml",
              ".github/workflows/release.yml",
              ".github/actions/build-s9pk/action.yml",
              ".github/dependabot.yml",
            ]) { YAML.parse(fs.readFileSync(f, "utf8")); console.log("parses:", f); }
          '

  build-s9pk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # All start-cli verification and build-environment prep lives in this action, so the release
      # workflow runs the identical steps.
      - uses: ./.github/actions/build-s9pk
        with:
          s9pk-build-key: ${{ secrets.S9PK_BUILD_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s9pk
          path: '*.s9pk'
          if-no-files-found: error

  no-internal-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Guard against infra leakage
        run: |
          if git grep -nIE '192\.168\.[0-9]|(^|[^0-9.])10(\.[0-9]{1,3}){3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]|/home/|/data/|[a-z2-7]{16,56}\.onion' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Internal infra reference (IP / local path / onion) found in a tracked file."
            exit 1
          fi
          echo "no internal refs"
